# Render Blueprint for LazyDesk.
#
# One repository, two services:
#
#   lazydesk-api  the FastAPI service (Python)  -> https://lazydesk-api.onrender.com
#   lazydesk-web  the static Next.js UI         -> https://lazydesk-web.onrender.com
#
# Deploy: push this file to your repo, then in Render choose New + -> Blueprint
# and select the repository. Render creates both services from this file.
#
# After the first deploy, open the static site and append the service token:
#   https://lazydesk-web.onrender.com/?token=<value from Render dashboard>
# The UI keeps it in localStorage, so it only has to be entered once.

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: lazydesk-api
    runtime: python
    # The free plan keeps the demo free of charges. Free instances sleep
    # after ~15 minutes of inactivity, so the first request after a pause
    # takes a moment while the service wakes up.
    plan: free
    buildCommand: pip install -r services/organizer/requirements.txt
    # Render routes public traffic to $PORT on the container interface, so the
    # hosted service starts uvicorn directly. `python -m organizer` still
    # refuses non-loopback binds on purpose; that guard stays for desktop use.
    # The two variables keep the startup log reporting the address actually
    # used instead of the desktop default of 127.0.0.1:8765.
    startCommand: >-
      LAZYDESK_HOST=0.0.0.0
      LAZYDESK_PORT=$PORT
      uvicorn organizer.main:app
      --host 0.0.0.0
      --port $PORT
      --app-dir services/organizer
    # FastAPI has no root route. /api/health is public and always answers 200.
    healthCheckPath: /api/health
    envVars:
      # The version the test suite is run against. Must be fully qualified.
      - key: PYTHON_VERSION
        value: "3.13.14"
      # Generated by Render, never committed, shared with the UI via fromService.
      - key: LAZYDESK_SERVICE_TOKEN
        generateValue: true
      # SQLite and the token file live here, not in the repository checkout.
      - key: LAZYDESK_DATA_DIR
        value: /opt/render/project/src/data
      # Origin of the hosted UI. Cross-origin requests are only accepted from
      # exact origins, never patterns, so this must equal the static site URL
      # character for character. If Render gave your static site a different
      # name, this is the one line to change.
      - key: LAZYDESK_ALLOWED_ORIGINS
        value: https://lazydesk-web.onrender.com
      - key: LAZYDESK_LOG_LEVEL
        value: info

    # Persistent disk for the SQLite database. Free instances have no disk, so
    # history and settings reset on every deploy - harmless for a demo. On a
    # paid plan uncomment this block to keep them. The data directory above
    # already matches the mount path.
    # disk:
    #   name: lazydesk-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1

  # --------------------------------------------------------------- frontend
  - type: web
    name: lazydesk-web
    runtime: static
    staticPublishPath: ./apps/web/out
    # Skip the Electron download: the desktop shell is not part of this build.
    buildCommand: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci && npm run build:web
    envVars:
      # Static sites build once, so Next.js inlines this at build time.
      - key: NEXT_PUBLIC_LAZYDESK_API
        fromService:
          name: lazydesk-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Baked into the public bundle, so anyone can read it: it only protects
      # the demo instance. For a private token delete this entry, set
      # LAZYDESK_SERVICE_TOKEN yourself in the dashboard, and open
      # https://<your-site>/?token=<that value> once - the UI keeps it in
      # localStorage.
      - key: NEXT_PUBLIC_LAZYDESK_TOKEN
        fromService:
          name: lazydesk-api
          type: web
          envVarKey: LAZYDESK_SERVICE_TOKEN
      # Tell Render not to run its own `npm install`; the buildCommand above
      # installs exactly what the UI needs, without the ~100 MB Electron binary.
      - key: SKIP_INSTALL_DEPS
        value: "true"
